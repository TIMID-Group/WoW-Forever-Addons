name: Reports
# By hand from the Actions tab (no schedule: the owner chose not to keep a token for it): rebuild the
# README's Reports list from every addon's issues, and keep the org's project board in step. Needs the
# HUB_READ_TOKEN secret; without it, it does nothing. The coordinator runs the same script locally
# after handling issues. See .github/scripts/reports.py.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: reports
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rebuild the Reports list
        env:
          HUB_READ_TOKEN: ${{ secrets.HUB_READ_TOKEN }}
          PROJECT_TITLE: ${{ vars.PROJECT_TITLE }}
          CLASSIFIED_WORDS: ${{ secrets.CLASSIFIED_WORDS }}
        run: python3 .github/scripts/reports.py
      - name: Save it
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Reports list refreshed" README.md
            git push -q
          fi
