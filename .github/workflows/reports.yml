name: Reports
# Every hour (and by hand from the Actions tab): rebuild the README's Reports list from every addon's
# issues, and keep the org's project board in step. See .github/scripts/reports.py.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: reports
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the Reports list
        env:
          HUB_READ_TOKEN: ${{ secrets.HUB_READ_TOKEN }}
          PROJECT_TITLE: ${{ vars.PROJECT_TITLE }}
        run: python3 .github/scripts/reports.py
      - name: Save it
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Reports list refreshed" README.md
            git push -q
          fi
