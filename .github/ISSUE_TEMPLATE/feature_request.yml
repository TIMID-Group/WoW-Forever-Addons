name: Suggest an idea
description: Something all the TIMID addons, the TIMID button, or several addons together could do, or do better.
title: "Idea"
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/TIMID-Group/WoW-Forever-Addons/main/media/brand/timid-logo.png" alt="TIMID Group" width="48" align="right">

        **No title needed.** It is filled in for you.

        **For TIMID as a whole:** the TIMID button and its panel, the TIMID Group window, a new addon, or an idea for several addons at once.

        **From the game,** press **Suggest an idea** in the TIMID Group window (type `/timid`), or type `/timid idea`. Copy the link it gives you and open it: the Addon and Details boxes come filled in. Write your idea in the boxes below and press Submit.

        **About one addon?** Report it on that addon's own page instead (you need access to it; the button in the game takes you there): Forever Apprentice: [suggest an idea](https://github.com/TIMID-Group/ForeverApprentice/issues/new?template=feature_request.yml); Forever Crafting Ledger: [suggest an idea](https://github.com/TIMID-Group/ForeverCraftingLedger/issues/new?template=feature_request.yml); Forever Ding: [suggest an idea](https://github.com/TIMID-Group/ForeverDing/issues/new?template=feature_request.yml); Forever Fishing Chart: [suggest an idea](https://github.com/TIMID-Group/ForeverFishingChart/issues/new?template=feature_request.yml); Forever Quest Leftovers: [suggest an idea](https://github.com/TIMID-Group/ForeverQuestLeftovers/issues/new?template=feature_request.yml); Forever Stocking Stuffer: [suggest an idea](https://github.com/TIMID-Group/ForeverStockingStuffer/issues/new?template=feature_request.yml); Forever Wanderer: [suggest an idea](https://github.com/TIMID-Group/ForeverWanderer/issues/new?template=feature_request.yml); Forever Workbench: [suggest an idea](https://github.com/TIMID-Group/ForeverWorkbench/issues/new?template=feature_request.yml).

        **This page is public:** anyone can read what you post. The report from the game holds nothing about your character, gold or account; please don't add any.
  - type: input
    id: addon
    attributes:
      label: Addon
      description: "TIMID Group, for TIMID as a whole. Filled in when you come from the game."
      value: "TIMID Group"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: Where you were, filled in from the game. Leave it as it is, or blank.
      placeholder: "for example: Settings"
  - type: textarea
    id: help
    attributes:
      label: What would help?
      description: Your idea, in your own words.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you trying to do?
      description: The problem it would solve.
  - type: textarea
    id: how
    attributes:
      label: How could it work? (optional)
      description: If you have a picture of it in your head, describe it or sketch it.
  - type: textarea
    id: idea
    attributes:
      label: Details from the game
      description: "Filled in by the game's link: the version, your changed settings and every TIMID addon's version. Nothing about your character, gold or account. Leave it as it is. Came without the link? Paste the full report from `/timid idea` here."
      render: text
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots or sketches (optional)
      description: Paste a picture (Ctrl+V) or drag pictures here.
