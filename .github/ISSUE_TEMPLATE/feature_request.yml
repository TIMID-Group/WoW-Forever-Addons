name: Suggest an idea
description: Something one of the addons could do, or do better.
title: "Idea"
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **No title needed.** It is filled in for you.

        **From the game,** right-click the small report button (**!**) beside the gear on the addon's window, or press **Suggest an idea** in its settings. Copy the link it gives you and open it: the Addon, Area and Details boxes come filled in. Write your idea in the boxes below and press Submit.

        **This page is public:** anyone can read what you post. The report from the game holds nothing about your character, gold or account; please don't add any.
  - type: input
    id: addon
    attributes:
      label: Addon
      description: "Filled in when you come from the game. Otherwise type which one: Forever Crafting Ledger, Forever Fishing Chart, [classified], Forever Quest Leftovers, Forever Workbench."
      placeholder: "for example: Forever Workbench"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: Where you were, filled in from the game. Leave it as it is, or blank.
      placeholder: "for example: Queue"
  - type: textarea
    id: help
    attributes:
      label: What would help?
      description: Your idea, in your own words.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you trying to do?
      description: The problem it would solve.
  - type: textarea
    id: how
    attributes:
      label: How could it work? (optional)
      description: If you have a picture of it in your head, describe it or sketch it.
  - type: textarea
    id: idea
    attributes:
      label: Details from the game
      description: "Filled in by the game's link: the version, your changed settings and what you were looking at. Nothing about your character, gold or account. Leave it as it is. Came without the link? Paste the full report from `/wb report` (or the addon's own command) here."
      render: text
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots or sketches (optional)
      description: Paste a picture (Ctrl+V) or drag pictures here.
