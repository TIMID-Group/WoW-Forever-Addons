name: Request access
description: Ask for an invite to one or more of the invite-only addons.
title: "Access request"
labels: [access]
body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/TIMID-Group/WoW-Forever-Addons/main/media/brand/timid-logo.png" alt="TIMID Group" width="48" align="right">

        **No title needed.** Tick the addons you want and press Submit. If it is approved, you get an email invite for each one; accept it within 7 days.

        **This request is public until it is answered,** then it is removed. All it needs is your GitHub name, which GitHub adds for you, and the addons you tick. Please don't add anything private.
  - type: checkboxes
    id: addons
    attributes:
      label: Which addons?
      options:
        - label: Forever Crafting Ledger
        - label: Forever Ding
        - label: Forever Fishing Chart
        - label: Forever Quest Leftovers
        - label: Forever Workbench
  - type: textarea
    id: note
    attributes:
      label: Anything to add (optional)
