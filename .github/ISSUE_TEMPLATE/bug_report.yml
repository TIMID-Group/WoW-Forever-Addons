name: Report a problem
description: Something about all the TIMID addons, the TIMID button, or several addons at once is broken, wrong, or shows an error.
title: "Problem report"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/TIMID-Group/WoW-Forever-Addons/main/media/brand/timid-logo.png" alt="TIMID Group" width="48" align="right">

        **No title needed.** It is filled in for you.

        **For TIMID as a whole:** the TIMID button and its panel, the TIMID Group window, or something that goes wrong in several addons at once.

        **From the game,** press **Report a problem** in the TIMID Group window (type `/timid`), or type `/timid report`. Copy the link it gives you and open it: the Addon and Details boxes come filled in. Write what happened in the boxes below, add a screenshot if it helps, and press Submit.

        **About one addon?** Report it on that addon's own page instead (you need access to it; the button in the game takes you there): Forever Crafting Ledger: [report a problem](https://github.com/TIMID-Group/ForeverCraftingLedger/issues/new?template=bug_report.yml); Forever Ding: [report a problem](https://github.com/TIMID-Group/ForeverDing/issues/new?template=bug_report.yml); Forever Fishing Chart: [report a problem](https://github.com/TIMID-Group/ForeverFishingChart/issues/new?template=bug_report.yml); Forever Quest Leftovers: [report a problem](https://github.com/TIMID-Group/ForeverQuestLeftovers/issues/new?template=bug_report.yml); Forever Stocking Stuffer: [report a problem](https://github.com/TIMID-Group/ForeverStockingStuffer/issues/new?template=bug_report.yml); Forever Workbench: [report a problem](https://github.com/TIMID-Group/ForeverWorkbench/issues/new?template=bug_report.yml).

        **This page is public:** anyone can read what you post. The report from the game holds nothing about your character, gold or account; please don't add any.
  - type: input
    id: addon
    attributes:
      label: Addon
      description: "TIMID Group, for TIMID as a whole. Filled in when you come from the game."
      value: "TIMID Group"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: Where you were, filled in from the game. Leave it as it is, or blank.
      placeholder: "for example: Settings"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: In your own words. Screenshots help; paste them in the last box.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again? (optional)
      description: The steps, if you know them.
  - type: textarea
    id: report
    attributes:
      label: Details from the game
      description: "Filled in by the game's link: the version, your changed settings and every TIMID addon's version. Nothing about your character, gold or account. Leave it as it is. Came without the link? Paste the full report from `/timid report` here."
      render: text
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots (optional)
      description: Paste a screenshot (Ctrl+V) or drag pictures here.
