name: Report a problem
description: Something in one of the addons is broken, wrong, or shows an error.
title: "Problem report"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **No title needed.** It is filled in for you; leave it as it is.

        **From the game,** press the small report button (**!**) beside the gear on the addon's window (or **Report a problem** in its settings, or type `/fcl report`, `/ffc report`, `[classified] report`, `/leftovers report`, `/wb report`). Copy the link it gives you and open it: this form opens with the report already filled in. Fill in the parts marked WRITE HERE, paste a screenshot below if it helps, and press Submit.

        **This page is public:** anyone can read what you post. The report from the game holds nothing about your character, gold or account; please don't add any.
  - type: input
    id: addon
    attributes:
      label: Addon
      description: "Filled in when you come from the game. Otherwise type which one: Forever Crafting Ledger, Forever Fishing Chart, [classified], Forever Quest Leftovers, Forever Workbench."
      placeholder: "for example: Forever Workbench"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: Filled in when you come from a settings page. Leave it as it is, or blank.
      placeholder: "for example: Selling"
  - type: textarea
    id: report
    attributes:
      label: The report from the game
      description: Filled in when you come from the game's link. Otherwise paste the report here, or answer the questions in your own words.
      render: text
      placeholder: |
        ----------------------------------------------------------------
          1. WHAT HAPPENED?
        ----------------------------------------------------------------
        WRITE HERE:

        ----------------------------------------------------------------
          2. WHAT DID YOU EXPECT TO HAPPEN?
        ----------------------------------------------------------------
        WRITE HERE:

        ----------------------------------------------------------------
          3. HOW CAN WE MAKE IT HAPPEN AGAIN? (skip it if you are not sure)
        ----------------------------------------------------------------
        WRITE HERE:

        ################################################################
        ##  (The in-game report adds the details from the game here.)
        ################################################################
    validations:
      required: true
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots (optional)
      description: Paste a screenshot (Ctrl+V) or drag pictures here if they show the problem.
