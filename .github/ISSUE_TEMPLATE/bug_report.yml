name: Report a problem
description: Something in one of the addons is broken, wrong, or shows an error.
title: "Problem report"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **No title needed.** It is filled in for you.

        **From the game,** press the small report button (**!**) beside the gear on the addon's window, or **Report a problem** in its settings (or type `/fcl report`, `/ffc report`, `[classified] report`, `/leftovers report`, `/wb report`). Copy the link it gives you and open it: the Addon, Area and Details boxes come filled in. Write what happened in the boxes below, add a screenshot if it helps, and press Submit.

        **This page is public:** anyone can read what you post. The report from the game holds nothing about your character, gold or account; please don't add any.
  - type: input
    id: addon
    attributes:
      label: Addon
      description: "Filled in when you come from the game. Otherwise type which one: Forever Crafting Ledger, Forever Fishing Chart, [classified], Forever Quest Leftovers, Forever Workbench."
      placeholder: "for example: Forever Workbench"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: Where you were, filled in from the game. Leave it as it is, or blank.
      placeholder: "for example: Queue"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: In your own words. Screenshots help; paste them in the last box.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again? (optional)
      description: The steps, if you know them.
  - type: textarea
    id: report
    attributes:
      label: Details from the game
      description: "Filled in by the game's link: the version, your changed settings and any errors the addon caught. Nothing about your character, gold or account. Leave it as it is. Came without the link? Paste the full report from `/wb report` (or the addon's own command) here."
      render: text
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots (optional)
      description: Paste a screenshot (Ctrl+V) or drag pictures here.
